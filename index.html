<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <header>
            <img src="https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=800&q=80"
                alt="Fashion">
            <h1>Yupien's-Wear</h1>
            <p>Login To Your Acccount First</p>
        </header>
            <main>
                <form method="get" action="home.html">
                    <label for="email">Email:</label>
                    <br>
                    <input type="email" id="email" name="email" class="card-input" required>
                    <br>
                    <label for="password">Password:</label>
                    <br>
                    <input type="password" id="password" name="password" minlength="8" class="card-input" required>
                    <br>
                    <button type="submit" class="btn">Login</button>
                </form>
            </main>
    </div>
</body>

</html>
